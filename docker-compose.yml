services:
  # Postgres runs natively on the host (see docs/PROJECT-DATABASE-LOCAL-POSTGRES-MIGRATION.md),
  # not in Docker. Containerized services below reach it via host.docker.internal:5432.

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'

  backend-nest:
    build: .
    ports:
      - '3000:3000'
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: zipmart
      DB_PASSWORD: zipmart
      DB_NAME: zipmart
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_SPRING_URL: http://backend-spring:8080
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
    depends_on:
      redis:
        condition: service_started

  # Uncomment once zipmart-backend-spring exists as a sibling repo checkout:
  # backend-spring:
  #   build: ../zipmart-backend-spring
  #   environment:
  #     DB_HOST: host.docker.internal
  #     DB_PORT: 5432
  #     DB_USER: zipmart
  #     DB_PASSWORD: zipmart
  #     DB_NAME: zipmart
  #   # internal-only: no ports mapped to host
